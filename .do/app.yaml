name: 2iae-international
region: fra

services:
- name: web
  source_dir: /
  build_command: npm ci && npm run build
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: OPENAI_API_KEY
    value: ${OPENAI_API_KEY}
    type: SECRET
  - key: DATABASE_URL
    value: ${2iae-db.DATABASE_URL}
    type: SECRET
  - key: SESSION_SECRET
    value: ${SESSION_SECRET}
    type: SECRET

databases:
- name: 2iae-db
  engine: PG
  version: "15"
  size: db-s-dev-database