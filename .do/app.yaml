name: groupe-2iae
region: fra

services:
- name: web
  source_dir: /
  build_command: npm ci && npm run build
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  
  health_check:
    http_path: /api/health
    port: 5000
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3

  http_port: 5000

  routes:
  - path: /

  envs:
  - key: NODE_ENV
    value: production
    type: SECRET
  - key: SESSION_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_HOST
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_PORT
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_USER
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_PASS
    scope: RUN_TIME
    type: SECRET

databases:
- name: groupe2iae-db
  engine: PG
  version: "15"
  size: db-s-dev-database