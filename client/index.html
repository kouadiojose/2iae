        {"@type": "Question", "name": "Pourquoi choisir le Groupe 2IAE plutôt qu'une autre grande école en Côte d'Ivoire ?", "acceptedAnswer": {"@type": "Answer", "text": "2IAE forme par la pratique depuis 2006 : ferme-école et étang piscicole à Azaguié, chantiers-écoles en génie civil, et un parcours de création d'entreprise obligatoire pour 100 % des étudiants. L'école dispose de 5 campus (Abidjan Palmeraie et Yopougon, Yamoussoukro, Azaguié, M'Batto), d'internats et de partenariats internationaux (OIM, Union européenne, partenaires canadiens dont l'Université de Sherbrooke)."}},
        {"@type": "Question", "name": "Comment se préinscrire au Groupe 2IAE pour la rentrée ?", "acceptedAnswer": {"@type": "Answer", "text": "La préinscription se fait en ligne en cinq minutes sur www.2iae.com/preinscription, gratuitement et sans engagement. Un conseiller d'orientation vous rappelle ensuite pour finaliser le dossier. Les bacheliers orientés par l'État peuvent contacter directement leur campus."}},
